services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: links_app
      POSTGRES_USER: links_app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: