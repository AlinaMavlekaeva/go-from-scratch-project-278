name: Check project
on:
  push:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
      - name: Run tests
        run: make tests
      - name: Build project
        run: make build
